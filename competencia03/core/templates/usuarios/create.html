<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Usuário</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <style>
        .container { max-width: 600px; }
        h2 { margin-bottom: 30px; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; }
        input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }
        .help-text { font-size: 12px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>👥 Criar Usuário</h1>
    </nav>
    
    <div class="container">
        <div class="card">
            <h2>Criar Novo Usuário</h2>
            
            {% if error %}
            <div style="background-color: #fee; border: 1px solid #c33; color: #c33; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
                <strong>Erro:</strong> {{ error }}
            </div>
            {% endif %}
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="username">Username *</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Digite o username"
                        required
                        autofocus
                    >
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="email@exemplo.com"
                    >
                </div>
                
                <div class="form-group">
                    <label for="password">Senha *</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Digite a senha"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="first_name">Primeiro Nome</label>
                    <input 
                        type="text" 
                        id="first_name" 
                        name="first_name" 
                        placeholder="Nome"
                    >
                </div>
                
                <div class="form-group">
                    <label for="last_name">Sobrenome</label>
                    <input 
                        type="text" 
                        id="last_name" 
                        name="last_name" 
                        placeholder="Sobrenome"
                    >
                </div>
                
                <div class="form-group">
                    <div class="checkbox-group">
                        <input 
                            type="checkbox" 
                            id="is_staff" 
                            name="is_staff"
                            checked
                        >
                        <label for="is_staff" style="margin: 0;">É Dono de Empresa</label>
                    </div>
                    <p class="help-text">Marque esta opção para permitir que o usuário crie e gerencie empresas</p>
                </div>
                
                <button type="submit" class="btn btn-primary">Criar Usuário</button>
                <a href="{% url 'usuarios_list' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</body>
</html>
